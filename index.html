<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12251d">
  <title>Sales Snippets</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173128;
      --muted: #6a7b74;
      --paper: #fffdf7;
      --canvas: #e9eee9;
      --accent: #d9ff72;
      --accent-dark: #183b2c;
      --line: rgba(23, 49, 40, .14);
      --shadow: 0 26px 65px rgba(20, 47, 37, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(circle at 12% 5%, rgba(217, 255, 114, .55), transparent 24rem),
        radial-gradient(circle at 90% 95%, rgba(68, 126, 103, .18), transparent 28rem),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: clamp(28px, 6vw, 58px) 0 30px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.15rem, 7vw, 4rem);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .95;
    }

    .count {
      flex: none;
      padding-bottom: 4px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 650;
    }

    .card-shell {
      height: clamp(430px, 63svh, 610px);
      perspective: 1400px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 28px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transform-style: preserve-3d;
      transition: transform .58s cubic-bezier(.2, .75, .2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .card.is-flipped { transform: rotateY(180deg); }

    .card:focus-visible {
      outline: 4px solid rgba(24, 59, 44, .38);
      outline-offset: 5px;
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .front {
      align-items: center;
      justify-content: center;
      padding: clamp(30px, 7vw, 70px);
      background: var(--paper);
      text-align: center;
    }

    .back {
      padding: clamp(26px, 5vw, 46px);
      background: var(--accent-dark);
      color: #f8faef;
      transform: rotateY(180deg);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      align-self: center;
      min-height: 28px;
      margin-bottom: 26px;
      padding: 6px 11px;
      border-radius: 999px;
      background: #eff4ec;
      color: #517064;
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .prompt {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.85rem, 5.2vw, 3.5rem);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.08;
      text-wrap: balance;
    }

    .tap-hint {
      position: absolute;
      bottom: 27px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
      transform: translateX(-50%);
    }

    .tap-hint::before {
      width: 9px;
      height: 9px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      content: "";
    }

    .answer-label {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: .7rem;
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .response {
      overflow-y: auto;
      margin: 0;
      padding: 0 12px 24px 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2.7vw, 1.32rem);
      line-height: 1.58;
      white-space: pre-line;
      scrollbar-color: rgba(217, 255, 114, .5) transparent;
    }

    .response::-webkit-scrollbar { width: 7px; }
    .response::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(217, 255, 114, .42);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 12px;
      margin-top: 16px;
    }

    .control {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .56);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: transform .15s ease, background .15s ease;
    }

    .control:hover { background: rgba(255, 255, 255, .88); }
    .control:active { transform: translateY(1px); }
    .control:focus-visible {
      outline: 3px solid rgba(24, 59, 44, .3);
      outline-offset: 2px;
    }

    .control.primary {
      border-color: var(--accent-dark);
      background: var(--accent);
      color: #102c21;
    }

    .control.primary:hover { background: #e4ff98; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 17px;
      color: var(--muted);
      font-size: .76rem;
    }

    footer a { color: inherit; }

    @media (max-width: 560px) {
      .app { width: min(100% - 20px, 760px); padding-top: 24px; }
      header { align-items: center; }
      .card-shell { height: 65svh; min-height: 440px; }
      .face { border-radius: 23px; }
      .controls { grid-template-columns: 1fr; }
      footer { flex-direction: column; align-items: center; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">Practice deck</p>
        <h1>Sales Snippets</h1>
      </div>
      <div class="count" id="count"></div>
    </header>

    <section class="card-shell" aria-live="polite">
      <button class="card" id="card" type="button" aria-label="Flashcard. Tap to reveal the response" aria-pressed="false">
        <span class="face front">
          <span class="badge" id="type"></span>
          <span class="prompt" id="prompt"></span>
          <span class="tap-hint">Tap to reveal</span>
        </span>
        <span class="face back">
          <span class="answer-label">Response</span>
          <span class="response" id="response"></span>
        </span>
      </button>
    </section>

    <div class="controls">
      <button class="control" id="flip" type="button">Show response</button>
      <button class="control primary" id="next" type="button">Next random card →</button>
    </div>

    <footer>
      <span>Tap the card · Space to flip · → for next</span>
      <a href="https://app.notion.com/p/louisdemaso/eea9f5e7820f4cfe917b8b236bf596d2?v=9f3102a6cdff4494846e9947f3c7f6c9" target="_blank" rel="noreferrer">Open source in Notion ↗</a>
    </footer>
  </main>

  <script>
    const cards = [
      {
        name: "I want to talk with my trusted/knowledgeable advisor.",
        type: "Objection",
        response: `Makes sense to me. Is there a specific part that you want his input on?

(Note: This first question quietly explores permission-vs-expertise. If they have a specific question then they are looking for expertise that I can try to provide. If they can’t name anything, then they just want to justify the decision they’ve already made, and that’s the green light for my deposit push.)

Okay, well, let’s just pretend for a moment that he gave you the thumbs up. Would we be working together today?

And what makes you say that?

Soft press (postpone deposit): Okay, well it sounds like this is something that you WANT to do, and I want you to be confident in your decision too… and I also don’t want this decision to drag on for you. Do you think, realistically, you can talk to him tonight? (Then schedule a follow-up call for tomorrow.)

Optional deposit ask: The truth is, by getting the ball rolling now with the deposit, you’re not putting yourself into a corner. You’re just giving me a signal of INTENT so our team can go DEEPER with you—we can get everything lined up so that when you do choose to move forward, the process is seamless and quick. If your advisor raises a real concern, we’ll work through it together, and I’ll happily refund your deposit if it turns out we’re not the right fit for you. So, knowing that, what do you say to showing that INTENT today and getting closer to having this decision off your plate?`
      },
      {
        name: "I need more time / need more information to make the decision.",
        type: "Objection",
        response: `Okay, I hear you. That’s fine. No worries.

But I guess, that aside, what do you think about the process I’ve described? Do you feel like it is EVERYTHING you’re looking for?

[Discuss this topic with the prospect until I can tie them down to being 100% confident in the process/product.]

What makes you feel like it’s exactly what you’re looking for?

[Prospect sells themselves on my solution.]

Okay, great. I’m happy to hear that.

With that being the case, can I ask you an honest question? What makes you want to slow this process down and spend countless more hours on this decision? AND/OR What are you hoping to learn during that time or from research that will make this decision easier for you? AND/OR What do you think will change when you get more information?

Well look, since you can already see yourself working with us, what do you say to getting started today? And if you get another quote that really changes things for you, then we can take a look and figure it out together. And if it winds up making the most sense for us to refund your deposit, then I’ll happily do that. I have no concerns about doing that.`
      },
      {
        name: "We have another project we want to do first, so this can wait.",
        type: "Objection",
        response: `Framework for competing priorities: isolate, cost of delay, define the condition.

1. ISOLATE. Don't argue your project against theirs; you'll lose, because their other project is emotional and yours isn't. Instead, make them defend the order: “Why is it important to hold off on this until after the kitchen is done?” Usually the ranking is just habit, and it wobbles the moment they have to justify it.

2. COST OF DELAY. “What happens if you wait until next spring to do this?” Let them answer. They'll say it themselves: another summer with the upstairs unusable, and prices don't go down. Far stronger coming from them than asserted by you.

3. DEFINE THE CONDITION. “So what would it take for you to move forward with this now, before the kitchen?” This converts a vague objection into a specific, solvable requirement.

THEN HAND OFF. The condition they name is a different objection, and that's where you go next. It might be comparing quotes, financing, timing, or needing the spouse on board. Don't try to close from here. Identify which objection just surfaced and run that card.`
      },
      {
        name: "The price is too high.",
        type: "Objection",
        response: `I hear you and I appreciate your honesty. Just to clarify, when you say that the price is too high, do you mean that this is outside your budget, that you found a comparable product for less, or that it’s more than you were hoping to pay?`
      },
      {
        name: "This is out of our budget.",
        type: "Objection",
        response: `Yeah, I understand you want to be responsible and stick to your budget. I do the same thing. But when I find something that solves a problem for me and truly makes my life better or easier, I find a way to make it work.

Are you in a position where going forward here would keep you from paying your bills? Or are you just trying to determine whether spending more than you planned is WORTH IT in this case?`
      },
      {
        name: "I need to think about it. #1",
        type: "Objection",
        response: `No worries. I understand you want to take time to make the best decision. Tell me: on a scale from 1 to 10, 10 meaning you’re ready to move forward right now and 1 meaning you wouldn’t do this even if it were free… where would you say your confidence is at for making this decision and moving forward with us?`
      },
      {
        name: "I cannot afford it. #1",
        type: "Objection",
        response: `I completely understand, and I appreciate the honesty. I wouldn’t want you to do something that puts you in a bad financial situation. To be sure, do you mean that you don’t want to make the purchase right now? Or that you cannot make the purchase right now, even though you want to?`
      },
      {
        name: "I need to think about it. #2",
        type: "Objection",
        response: `No worries. I definitely understand you want to take time to make the best decision. Usually, when I am thinking through my own decisions, I end up considering the product, the service, and the pricing… which of these three things is your biggest concern right now?

Okay, so, [biggest concern] aside, are you 100% confident that this makes sense for you right now?`
      },
      {
        name: "Just send me info and I’ll review it later.",
        type: "Objection",
        response: `No worries. I can send you the information you’re looking for. It sounds like you want to take some time to make an informed decision, is that right?

Okay, so when I do send something over, I want to make sure I send the most helpful information. What exactly do you want to see to help you make this decision?`
      },
      {
        name: "I don’t trust salespeople.",
        type: "Objection",
        response: `Makes sense. Most people have had a bad experience with a salesperson at some point. So, when you say that, is it because of something that has happened in the past? Or just because you don’t want to be pushed into a decision that’s not right for you?

Well look, I’m not here to push anything on you, just to help you make a smart, confident decision.

Just so that I can give you the highest level of service, what would need to happen in this conversation for you to feel like this wasn’t just another sales pitch, and that I actually helped you?`
      },
      {
        name: "Can I talk to a reference? #2",
        type: "Objection",
        response: `Totally understand you wanting to talk to someone who’s already done this and is happy with their decision. And we have thousands of happy customers who are enjoying Jetson systems right now.

The thing is, I have 10 to 12 of these sales calls every day… and I’m just one salesperson! Think about how many people are considering purchasing our product right now… do you think our current customers would be happy if I asked them to talk with ALL those people?`
      },
      {
        name: "I need to discuss this with my spouse/partner.",
        type: "Objection",
        response: `I completely understand you want to talk to them first. Is this more of a respect thing, where you just want to let them know what you’re going to do? Or do you want their help making this decision?

If just respect: Okay, got it. Well, in that case, let’s just put down the $500 deposit now to get the ball rolling, and if your partner is very unhappy about the decision, we can always refund you the deposit. After all, we’re not in the business of ending marriages! (laugh)

If a joint decision: Okay, got it. What do you think your partner will be most focused on when you talk about this with him/her? What exactly would your partner say “no” to? (Explore this and pre-address any concerns.)

Okay, so let’s schedule a follow-up call together with your partner so that we can all address any questions or concerns together and get you moving on this project!`
      },
      {
        name: "I have found a cheaper price elsewhere.",
        type: "Objection",
        response: `Okay, I can tell that minimizing your costs is an important decision factor here… but is cost the ONLY thing that matters to you? Let’s think about what you’re getting from each option… because I just want to make sure you go into this with eyes wide open. My dad always told me, “you get what you pay for.”`
      },
      {
        name: "I need to research competitors / compare quotes.",
        type: "Objection",
        response: `Okay, I hear you. And I understand you wanting to do your due diligence—can I ask, what are you hoping to learn from your research or quote comparison?

That's fair. I want you to be confident you're getting the most value out of this investment. If I'm being honest though, every quote means another contractor in your house for a couple of hours trying to sell you their system. And I know your time is valuable. How many quotes do you think actually makes sense for you to get?

NOTE: Don't ask how long they need to get those quotes. That hands over the pen. Let them name the count, then you name the date.

Great. Let's plan on touching base this Friday to see where you've landed. That keeps things moving and gets this off your plate.`
      },
      {
        name: "Can I talk to a reference? #1",
        type: "Objection",
        response: `Totally understand you wanting to talk to someone who’s already done this and is happy with their decision. And we have thousands of happy customers who are enjoying Jetson systems right now.

Quick question for you—where was the last place you went on vacation? Sounds like a blast. Before booking that vacation, did you attempt to call a bunch of people to hear about their experience there? Or did you read reviews online? Exactly… that’s how people make informed decisions these days, by reading reviews online. Have you seen our reviews?`
      },
      {
        name: "I'm not looking to make a decision today",
        type: "Objection",
        response: `I hear you, and I completely understand that you weren't planning to make a decision today. If I’m being honest though, not making a decision today is actually a decision—to delay making this decision, right? (laugh)

— Path #1: Personal Responsibility

Remember, every time you choose NOT to take action towards your goals is you training yourself to stay put. Choosing NOT to do this today is, itself, a choice in the opposite direction of your goals.

So, let me ask you this: do you want to make a choice today that brings you closer to your goals, or further from them?

— Path #2: Decision Fatigue

I know you’re a busy person. I am too. And I want to help you get this decision off your plate so you can focus on other things.

Tell me, what is the one thing that’s keeping you from confidently making a decision to move forward today?`
      },
      {
        name: "I don’t TRUST that your company will deliver the solution you’ve described (I’ve been burned before)",
        type: "Objection",
        response: `Okay, I hear you. And I want you to feel confident in us and in the solution.

And listen, I hate that you had that experience. Those people shouldn’t be in business.

But if you let what they did stop you from making the right decision for yourself today, they’re still controlling your future.

Do you really want to give them that power?

So, let me ask you this: one bad girlfriend doesn’t mean you’re never going to get married, right?

The reality is, no matter what I show you today, you’re never going to be 100% certain that we’ll deliver exactly what we say… or that you’ll reach your goals. Nobody gets 100% certainty.

Elon Musk says he’s going to put people on Mars. Is anybody 100% certain he’ll pull it off? No.

All you can really do is put yourself in the best possible position to succeed, then work your ass off to make it happen.

Think about the most successful people in the world. Did everything they tried work? Of course not. They failed a lot. The difference is they kept going.

A winner is really just a loser who tried one more time.

So let me ask you: do you agree that nothing is ever 100% certain?

Great. And if you keep waiting for 100% certainty before you act, where does that leave you?

Exactly. Stuck.

So which gives you a better chance of reaching your goals: waiting for 100% certainty that will never come, or taking action even when there’s uncertainty?

Why?

Exactly. So what do you think you should do now if you want to give yourself the best chance of reaching your goals?

Because when you picture everything you want to achieve, is getting there worth taking another shot?

Yes, this program is going to cost you $$$.

But not doing it could cost you the goals and dreams you’ve been talking about.

Ultimately, you’re the one making the choice today. Would you rather make the one-time investment and put yourself in the best possible position to reach that goal? Or stay where you are and keep hoping that someday things change?

Because again, nothing is certain. But which path is more likely to get you there: trying again, or letting what happened in the past keep you from moving forward?`
      },
      {
        name: "Identity shift",
        type: "Process",
        response: `Look, I know this investment is unexpected.

But you told me you want to achieve [BIG GOAL], and you want to do it within the next year.

Would you agree that to get a different result, you have to become the kind of person who can create that result?

Because the difference between the person who gets there and the person who doesn’t usually comes down to who they are—the decisions they make, how they spend their time, and how they act when things get uncomfortable.

So if you want to become that person, wouldn’t you need to start thinking and making decisions the way that person would?

Because it starts in your head. It starts with believing that you can reach that goal—and deciding that you’re going to find a way to make it happen.

The trap most people fall into is waiting until they feel like that person.

They think, “I don’t have enough money yet. I don’t have enough time. I’m not disciplined enough.”

But if you wait until you already have the results before you start making decisions like the person who creates those results, you’ll stay in the same loop.

At some point, you have to start making decisions like that person before you fully become that person.

So let me ask you this:

If you keep making decisions exactly the way you make them today, what kind of results are you going to keep creating?

Probably more of the life you already have, right?

So how much longer do you want to keep making decisions that way?

Whose mindset do you need to adopt instead?

Which version of you is more likely to reach the goal you told me you want?

And if you were already that person—the person capable of reaching that goal—what would they do right now?`
      }
    ];

    const card = document.querySelector("#card");
    const prompt = document.querySelector("#prompt");
    const response = document.querySelector("#response");
    const type = document.querySelector("#type");
    const count = document.querySelector("#count");
    const flipButton = document.querySelector("#flip");
    const nextButton = document.querySelector("#next");

    let deck = [];
    let current = null;
    let isFlipped = false;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function fillDeck() {
      const previousName = current?.name;
      deck = shuffle(cards);
      if (deck.length > 1 && deck[deck.length - 1].name === previousName) {
        [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
      }
    }

    function setFlipped(value) {
      isFlipped = value;
      card.classList.toggle("is-flipped", value);
      card.setAttribute("aria-pressed", String(value));
      card.setAttribute("aria-label", value
        ? "Flashcard response. Tap to return to the prompt"
        : "Flashcard prompt. Tap to reveal the response");
      flipButton.textContent = value ? "Show prompt" : "Show response";
    }

    function showNext() {
      if (!deck.length) fillDeck();
      current = deck.pop();
      setFlipped(false);
      prompt.textContent = current.name;
      response.textContent = current.response;
      response.scrollTop = 0;
      type.textContent = current.type;
    }

    function toggleCard() { setFlipped(!isFlipped); }

    card.addEventListener("click", toggleCard);
    flipButton.addEventListener("click", toggleCard);
    nextButton.addEventListener("click", showNext);
    document.addEventListener("keydown", (event) => {
      if (event.code === "ArrowRight") {
        event.preventDefault();
        showNext();
      }
    });

    count.textContent = `${cards.length} cards`;
    showNext();
  </script>
</body>
</html>
